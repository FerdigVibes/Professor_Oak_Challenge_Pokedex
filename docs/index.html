<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta charset="UTF-8" />
  <title>Pokédex Oak Challenge</title>
  <link rel="stylesheet" href="./assets/css/main.css">
  <link rel="stylesheet" href="./assets/css/mobile.css">
</head>

<body>
  <header id="top-bar">
    <div class="topbar-row topbar-title-row">
      <span id="app-title" class="topbar-title">Professor Oak Pokédex</span>
    </div>
  

    <div class="topbar-row topbar-controls">
      <div class="game-selector">
        <button id="game-selector-btn" class="control">
          Select Version ▾
        </button>
      </div>
      
      <button id="mute-toggle" class="control" title="Toggle Cry Audio">🔊</button>

      <div class="reset-dropdown">
        <button
          id="reset-section-btn"
          class="control"
          data-i18n="resetSection"
          aria-expanded="false"
        ></button>
      
        <div id="reset-section-menu" class="reset-menu hidden">
       
        </div>
      </div>
      
      <input
        type="text"
        id="search-input"
        placeholder="Search Pokémon..."
        class="control search-input"
      />
      <select id="language-selector" aria-label="Language selector">
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
      </select>
    </div>
  
    
    <div class="topbar-row topbar-progress">
      <div class="objective">
        <strong id="objective-label">${t('currentObjective')}:</strong>
        <span id="current-objective">${t('objective.none')}</span>
      </div>
    
      <div class="progress">
        <span id="progress-text" class="progress-label">0 / 0 Pokémon caught</span>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
    
      <button id="game-time-btn" class="control time-btn hidden">
        <span class="game-time-label">Mon 10:00 AM</span>
        <span class="row-day-icons"></span>
      </button>
    </div>
  </header>
  <main id="app">
    <section id="section-list">
      <div class="section-bg"></div>
    </section>
    <section id="detail-panel">
      <p>Select a Pokémon</p>
    </section>
  
  </main>
  
  <div id="map-modal" class="map-modal hidden">
    <div class="map-backdrop"></div>
  
    <div class="map-window">
      <div class="map-container">
        <button class="map-close" aria-label="Close map">×</button>
  
        <img id="map-image" />
        <div id="map-pins"></div>
      </div>
    </div>
  </div>
  <div id="game-time-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop"></div>

    <div class="modal-panel">
      <h2 data-i18n="gameTime.title">Set Game Time</h2>

      <div class="form-row">
        <label data-i18n="gameTime.day">Day</label>
        <select id="gt-day"></select>
      </div>

      <div class="form-row time-row">
        <label data-i18n="gameTime.time">Time</label>
        <select id="gt-hour"></select>
        <span>:</span>
        <select id="gt-minute"></select>
        <select id="gt-meridiem"></select>
      </div>

      <div class="form-row">
        <label>
          <input type="checkbox" id="gt-dst" />
          <span data-i18n="gameTime.dst">Daylight Saving Time</span>
        </label>
      </div>

      <div class="modal-actions">
        <button id="gt-cancel" data-i18n="common.cancel">Cancel</button>
        <button id="gt-save" class="primary" data-i18n="common.save">Save</button>
      </div>
    </div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
